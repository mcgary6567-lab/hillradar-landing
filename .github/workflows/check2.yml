name: Diagnose images
on:
  workflow_dispatch: {}
  push:
    paths: ['.github/workflows/check2.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe app image endpoints
        run: |
          APP=https://hillradar-ai.fly.dev
          SITE=https://hillradar.com
          echo "== app /api/logo/{ticker} (content-type + bytes) =="
          for t in MSFT AAPL HD NVDA GOOGL META; do
            r=$(curl -s -o /tmp/l -w "%{http_code} %{content_type} %{size_download}" "$APP/api/logo/$t"); echo "logo $t -> $r"
          done
          echo "== app /api/photo/{bioguide} (Pelosi, Tuberville, Schumer) =="
          for b in P000197 T000476 S000148; do
            r=$(curl -s -o /tmp/p -w "%{http_code} %{content_type} %{size_download}" "$APP/api/photo/$b"); echo "photo $b -> $r"
          done
          echo "== public landing: active[0] (has ext_id after app redeploy?) =="
          curl -s "$APP/api/public/landing" -o api.json
          echo -n "active[0]: "; jq -c '.active[0]' api.json 2>/dev/null
          echo -n "popular[0]: "; jq -c '.popular[0]' api.json 2>/dev/null
          echo "== landing: homepage app.js version + does served app.js call the app endpoints? =="
          curl -s "$SITE/" | grep -oE 'app\.js\?v=[0-9]+' | sort -u
          curl -s "$SITE/app.js?v=6" | grep -oE 'api/(logo|photo)' | sort -u
