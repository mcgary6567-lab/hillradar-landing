name: Fetch insight photos
on:
  workflow_dispatch: {}
  push:
    paths: ['.github/workflows/fetch-insight-photos.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download, crop to 1200x630, convert
        run: |
          set -e
          mkdir -p assets/insights
          fetch() { curl -fsSL "$2" -o /tmp/in.png && convert /tmp/in.png -resize 1200x630^ -gravity center -extent 1200x630 -quality 86 "assets/insights/$1.jpg" && identify "assets/insights/$1.jpg"; }
          fetch what-is-the-stock-act                       "https://d8j0ntlcm91z4.cloudfront.net/user_3IUJwWfqibR0469Ah4SEqdgyl8a/hf_20261023_080415_abfafb7f-c50a-47dc-a9b0-67d614d1b22e.png"
          fetch congress-stock-trades-by-the-numbers        "https://d8j0ntlcm91z4.cloudfront.net/user_3IUJwWfqibR0469Ah4SEqdgyl8a/hf_20261023_080547_6b9ce60c-d59e-4803-bfcd-020fcd405763.png"
          fetch most-traded-stocks-by-members-of-congress   "https://d8j0ntlcm91z4.cloudfront.net/user_3IUJwWfqibR0469Ah4SEqdgyl8a/hf_20261023_080618_5b77b2e9-ec52-43db-b379-4fe4653bbfda.png"
          fetch how-the-stock-act-affects-investors          "https://d8j0ntlcm91z4.cloudfront.net/user_3IUJwWfqibR0469Ah4SEqdgyl8a/hf_20261023_080522_adee9e46-a59b-491f-8c28-0e2399a9bf22.png"
      - name: Commit to insights-photos branch
        run: |
          git config user.name "hillradar-bot"
          git config user.email "noreply@anthropic.com"
          git checkout -b insights-photos
          git add assets/insights/*.jpg
          git commit -m "Photographic Featured insights thumbnails (Higgsfield z_image)"
          git push -f origin insights-photos
