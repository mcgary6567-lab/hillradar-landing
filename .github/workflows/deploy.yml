name: Deploy to Hostinger

# Auto-deploys the site to Hostinger over FTPS on every push to main, then verifies
# the live site. One-time setup — add these repo secrets in
#   Settings → Secrets and variables → Actions → New repository secret:
#     FTP_SERVER    e.g. ftp.hillradar.com  (hPanel → Files → FTP Accounts → "FTP host")
#     FTP_USERNAME  the FTP account username
#     FTP_PASSWORD  the FTP account password
# Until those are set the workflow runs green and does nothing (see the "check" step).
#
# Notes:
# - server-dir is public_html/. If your FTP account already lands inside public_html,
#   change it to ./ below.
# - protocol is ftps (secure). If your host only offers plain FTP, change it to ftp.
# - If Hostinger's own Git auto-deploy is also enabled, turn it off so the two don't
#   fight over public_html.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy is configured
        id: cfg
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FTP secrets not set — skipping deploy. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD under Settings → Secrets and variables → Actions."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        if: steps.cfg.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: public_html/
          # Build scripts, docs and repo meta never belong on the host.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            docs/**
            node_modules/**
            README.md
            .gitignore

      - name: Verify the live site
        if: steps.cfg.outputs.configured == 'true'
        env:
          SITE: https://hillradar.com
        run: |
          set -u
          # Give the origin a moment to settle after the upload.
          sleep 5
          fail=0

          check_200() {
            local path="$1" code
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE$path")
              [ "$code" = "200" ] && { echo "200  $path"; return 0; }
              sleep 5
            done
            echo "::error::$path returned $code (expected 200)"; fail=1
          }

          check_200 "/"
          check_200 "/press/"
          check_200 "/congress/"
          check_200 "/blog/how-the-stock-act-affects-investors/"

          # The new app.js (with company logos) must be the one being served.
          if curl -fsS "$SITE/app.js?v=4" | grep -q "clogo"; then
            echo "OK   app.js?v=4 contains the company-logo code"
          else
            echo "::error::app.js?v=4 is missing the logo code — an older asset is still served"; fail=1
          fi

          # Build/source dirs must not be publicly served.
          tcode=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/tools/data.json")
          case "$tcode" in
            403|404) echo "OK   /tools/ blocked ($tcode)";;
            *) echo "::warning::/tools/data.json returned $tcode (expected 403/404)";;
          esac

          [ "$fail" = "0" ] || { echo "Deployment verification failed."; exit 1; }
          echo "Live site verified."
